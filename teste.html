<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Funcionando</title>
  <style>
    body {
      overflow-x: hidden;
    }

    h1 {
      color: black;
      font-family: Verdana;
      font-size: 70px;
      text-align: center;
    }

    img {
      display: block;
      margin: 0 auto;
      width: 300px;
      height: 300px;
      filter: grayscale(100%);
      transition: filter 0.5s ease;
    }

    img:hover {
      filter: grayscale(0%);
    }

    h2 {
      color: #333333;
      text-align: center;
      font-family: Verdana;
      animation: deslizarDaEsquerda 1.5s ease-out forwards;
    }

    @keyframes deslizarDaEsquerda {
      from {
        opacity: 0;
        transform: translateX(-100vw); 
      }
      to {
        opacity: 1;
        transform: translateX(0); 
      }
    }
    
  </style>
</head>
<body>

  <h1>Meu Título Principal</h1>
  <h2>Este subtítulo aparece com transição suave</h2>
  <img src="https://upload.wikimedia.org/wikipedia/commons/d/db/Nasa_blue_marble.jpg" alt="Imagem de teste">

</body>
</html>
